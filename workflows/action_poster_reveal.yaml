version: "1.0"

metadata:
  name: "Action Poster Reveal"
  description: |
    Creates the viral "action poster reveal" effect.
    Person walks into frame → beat drop → freeze into stylized movie poster
    with shake effects, fire particles, and animated name text.
  author: "system"
  tags: ["trending", "action", "poster", "short-form", "tiktok", "reels"]
  preview_thumbnail: null

parameters:
  - name: name_text
    type: string
    required: true
    description: "Name to display on the poster (e.g., 'JOHN WICK')"

  - name: poster_style
    type: string
    default: "cinematic red atmosphere, action movie poster, dramatic lighting, film grain"
    description: "Style prompt for AI poster generation"

  - name: music_file
    type: file
    required: false
    description: "Background music (optional - will auto-detect beats)"

  - name: beat_index
    type: integer
    default: 0
    min: 0
    max: 5
    description: "Which beat triggers the poster reveal (0 = first beat drop)"

  - name: poster_duration
    type: float
    default: 3.0
    min: 1.0
    max: 10.0
    description: "How long to show the animated poster"

  - name: shake_intensity
    type: float
    default: 0.6
    min: 0.0
    max: 1.0
    description: "Camera shake intensity during poster reveal"

  - name: enable_particles
    type: boolean
    default: true
    description: "Add fire/spark particles during poster"

requires_analysis:
  - metadata
  - beat_detection
  - face_detection  # For smart cropping

steps:
  # ============================================
  # PHASE 1: Analyze and find the reveal moment
  # ============================================

  - id: determine_reveal_moment
    type: agent_decision
    prompt: |
      You are analyzing a video for the "action poster reveal" effect.

      Video info:
      - Duration: {{analysis.metadata.duration}}s
      - Resolution: {{analysis.metadata.width}}x{{analysis.metadata.height}}

      Beat timestamps (seconds): {{analysis.beat_detection.beats}}
      BPM: {{analysis.beat_detection.bpm}}

      The user wants the poster reveal at beat index {{beat_index}}.

      Determine:
      1. The exact timestamp for the freeze frame (should be slightly before the beat)
      2. Where to trim the intro video (start from beginning, end at reveal)

      The freeze should capture the subject in a powerful pose, ideally when
      they are well-centered in frame.
    outputs:
      - name: freeze_timestamp
        type: timestamp
        description: "Exact frame to freeze for poster"
      - name: intro_end
        type: timestamp
        description: "Where the walking intro ends"

  # ============================================
  # PHASE 2: Extract frame for poster generation
  # ============================================

  - id: extract_poster_frame
    type: extract_frame
    inputs:
      at: "{{steps.determine_reveal_moment.freeze_timestamp}}"
      format: png
    outputs:
      image_path: string

  # ============================================
  # PHASE 3: Generate stylized poster via Gemini
  # ============================================

  - id: generate_action_poster
    type: external_api
    service: gemini_imagen
    inputs:
      image: "{{steps.extract_poster_frame.image_path}}"
      prompt: |
        Transform this photo into: {{poster_style}}.
        Keep the person's likeness and pose.
        Add dramatic red/orange atmospheric lighting.
        Style like a Hollywood action movie poster.
      negative_prompt: "blurry, distorted face, extra limbs, watermark, text"
    outputs:
      - name: poster_image_path
        type: string

  # ============================================
  # PHASE 4: Build the video sequence
  # ============================================

  # 4a. Trim the intro (person walking in)
  - id: trim_intro
    type: trim
    inputs:
      start: 0
      end: "{{steps.determine_reveal_moment.intro_end}}"

  # 4b. Make vertical for mobile if needed
  - id: ensure_vertical
    type: conditional
    condition: "{{analysis.metadata.width}} > {{analysis.metadata.height}}"
    then:
      - id: crop_to_vertical
        type: crop
        inputs:
          aspect_ratio: "9:16"
          focus: face_detection
    else: []

  # 4c. Create the poster reveal segment with effects
  - id: poster_segment
    type: group
    steps:
      # Freeze frame base
      - id: poster_freeze
        type: freeze_frame
        inputs:
          at: "{{steps.determine_reveal_moment.freeze_timestamp}}"
          duration: "{{poster_duration}}"

      # Overlay the AI-generated poster with fade-in
      - id: poster_overlay
        type: add_image
        inputs:
          source: "{{steps.generate_action_poster.poster_image_path}}"
          position: center
          width: auto
          height: auto
          opacity: 1.0
          animation: fade_in
          animation_duration: 0.3
          start: 0  # Relative to this segment
          end: "{{poster_duration}}"

      # Color grading for dramatic atmosphere
      - id: red_atmosphere
        type: color_grade
        inputs:
          preset: cinematic_red
          tint: "#FF2200"
          tint_strength: 0.3
          contrast: 1.2
          saturation: 0.9

      # Camera shake on impact
      - id: impact_shake
        type: shake
        inputs:
          intensity: "{{shake_intensity}}"
          frequency: 15.0
          decay: true
          start: 0
          end: 1.5

      # Subtle rotation for dynamism
      - id: subtle_motion
        type: rotate
        inputs:
          from_angle: -1.5
          to_angle: 1.5
          easing: ease_in_out
          start: 0
          end: "{{poster_duration}}"

      # Fire particles (conditional)
      - id: add_fire_particles
        type: conditional
        condition: "{{enable_particles}} == true"
        then:
          - id: fire_overlay
            type: particles
            inputs:
              effect: fire
              intensity: 0.7
              color: "#FF4500"
              position: bottom
              start: 0.2
              end: "{{poster_duration}}"
        else: []

      # Animated name text
      - id: name_text_overlay
        type: add_text
        inputs:
          text: "{{name_text}}"
          position: bottom_center
          font: "Impact"
          font_size: 72
          font_color: "#FFFFFF"
          stroke_color: "#000000"
          stroke_width: 3
          animation: glitch
          animation_duration: 0.5
          start: 0.5
          end: "{{poster_duration}}"

  # 4d. Flash transition into poster
  - id: flash_transition
    type: transition
    inputs:
      effect: flash
      duration: 0.15
      at: "{{steps.determine_reveal_moment.intro_end}}"

  # ============================================
  # PHASE 5: Audio
  # ============================================

  - id: add_music
    type: conditional
    condition: "{{music_file}} != null"
    then:
      - id: overlay_music
        type: add_audio
        inputs:
          source: "{{music_file}}"
          volume: 0.8
          start_at: 0
          fade_in: 0.5
          fade_out: 1.0
          duck_original: 0.3
    else: []

output:
  format: mp4
  codec: h264
  quality: high
  resolution: 1080p
  fps: 30
